      margin:0;
      color:var(--white);

    }

    nav{
      margin-top:18px;
    }

    nav a{
      color:var(--silver);
      text-decoration:none;
      margin-right:20px;
      border-bottom:1px solid rgba(184,192,200,.55);
    }

    nav a:hover{
      color:var(--white);
    }

    main{

    }
